name: Source contracts

on:
  push:
    branches: [main, master, 'eng/**', 'fix/**', 'chore/**']
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip pytest
      - run: python tools/ps_lint.py src/app
      - run: python tools/ps_lint.py tests/powershell
      - run: python -m pytest -q
