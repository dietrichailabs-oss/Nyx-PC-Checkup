name: Independent QA finding
about: Track an immutable QA finding
labels: []
body:
  - type: input
    id: finding
    attributes:
      label: Finding ID
      placeholder: QAxx-F-xxx
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [CRITICAL, HIGH, MEDIUM, LOW]
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Exact reviewed artifact / SHA-256
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and reproduction
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Engineering correction requirement
    validations:
      required: true
